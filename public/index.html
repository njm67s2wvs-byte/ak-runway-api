<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07110b">
  <title>AK Code Protection</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div class="app">

    <header class="topbar">

      <div class="brand">
        <div class="brand-logo">AK</div>

        <div>
          <div class="brand-title">
            AK Code Protection
          </div>

          <div class="brand-status">
            <span></span>
            متصل
          </div>
        </div>
      </div>

      <button
        id="newChatButton"
        class="new-chat-button"
        type="button"
      >
        + محادثة جديدة
      </button>

    </header>


    <main
      id="chatContainer"
      class="chat-container"
    >

      <section
        id="welcomeScreen"
        class="welcome-screen"
      >

        <div class="welcome-icon">
          AK
        </div>

        <h1>
          مرحبًا بك في
          <strong>AK</strong>
        </h1>

        <p>
          أرسل كود، صورة، أو ملف وابدأ المحادثة.
        </p>


        <div class="feature-grid">

          <div class="feature-card">
            <div class="feature-icon">
              &lt;/&gt;
            </div>

            <div>
              <strong>أكواد ضخمة</strong>
              <span>دعم آلاف الأسطر</span>
            </div>
          </div>


          <div class="feature-card">
            <div class="feature-icon">
              📎
            </div>

            <div>
              <strong>رفع الملفات</strong>
              <span>أرسل ملفاتك بسهولة</span>
            </div>
          </div>


          <div class="feature-card">
            <div class="feature-icon">
              🖼️
            </div>

            <div>
              <strong>الصور</strong>
              <span>إرسال الصور داخل المحادثة</span>
            </div>
          </div>


          <div class="feature-card">
            <div class="feature-icon">
              ⚡
            </div>

            <div>
              <strong>سريع</strong>
              <span>واجهة خفيفة ومتجاوبة</span>
            </div>
          </div>

        </div>

      </section>


      <div
        id="messages"
        class="messages"
      ></div>

    </main>


    <footer class="composer-area">

      <div
        id="attachments"
        class="attachments"
      ></div>


      <div class="composer">

        <input
          id="fileInput"
          type="file"
          multiple
          hidden
        >


        <button
          id="attachButton"
          class="tool-button"
          type="button"
          title="إرفاق ملف"
        >
          📎
        </button>


        <textarea
          id="messageInput"
          rows="1"
          placeholder="اكتب رسالتك أو الصق الكود هنا..."
          spellcheck="false"
        ></textarea>


        <button
          id="sendButton"
          class="send-button"
          type="button"
          title="إرسال"
        >
          ➤
        </button>

      </div>


      <div class="composer-info">
        <span>AK Code Protection</span>
        <span>دعم الملفات والكود الكبير</span>
      </div>

    </footer>

  </div>


  <script src="/script.js"></script>

</body>
</html>
