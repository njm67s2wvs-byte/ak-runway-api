<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AK Code Protection</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div class="app">

    <header class="header">
      <div class="logo">
        <div class="logo-icon">AK</div>

        <div>
          <h1>AK Code Protection</h1>
          <span>Secure Code Assistant</span>
        </div>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        Online
      </div>
    </header>

    <main class="chat-container">

      <div id="messages" class="messages">

        <div class="message assistant">
          <div class="avatar">AK</div>

          <div class="bubble">
            <div class="message-name">AK Assistant</div>

            <p>
              أهلاً بك 👋
              <br>
              ابعت الكود أو اكتب رسالتك، وأنا جاهز أساعدك.
            </p>
          </div>
        </div>

      </div>

    </main>

    <footer class="input-area">

      <div class="input-wrapper">

        <textarea
          id="messageInput"
          placeholder="اكتب رسالتك أو الصق الكود هنا..."
          rows="1"
        ></textarea>

        <button id="sendButton" type="button">
          إرسال
        </button>

      </div>

      <div class="hint">
        يمكنك إرسال أكواد كبيرة جدًا بدون مشكلة
      </div>

    </footer>

  </div>

  <script src="/script.js"></script>

</body>
</html>
