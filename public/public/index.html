<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#07110b"
  >

  <title>AK Code Protection</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <div class="app">

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="topbar">

      <div class="brand">

        <div class="brand-logo">
          AK
        </div>

        <div class="brand-text">
          <div class="brand-title">
            AK Code Protection
          </div>

          <div class="brand-status">
            <span class="status-dot"></span>
            Online
          </div>
        </div>

      </div>

      <button
        class="new-chat-button"
        id="newChatButton"
        type="button"
      >
        + محادثة جديدة
      </button>

    </header>


    <!-- =========================
         CHAT AREA
    ========================== -->

    <main
      class="chat-container"
      id="chatContainer"
    >

      <section
        class="welcome-screen"
        id="welcomeScreen"
      >

        <div class="welcome-icon">
          AK
        </div>

        <h1>
          مرحبًا بك في
          <span>AK</span>
        </h1>

        <p>
          أرسل كود، صورة، أو ملف،
          وابدأ محادثتك.
        </p>


        <div class="feature-grid">

          <div class="feature-card">

            <div class="feature-icon">
              &lt;/&gt;
            </div>

            <div>
              <strong>
                أكواد ضخمة
              </strong>

              <span>
                يدعم آلاف الأسطر
              </span>
            </div>

          </div>


          <div class="feature-card">

            <div class="feature-icon">
              📎
            </div>

            <div>
              <strong>
                رفع الملفات
              </strong>

              <span>
                أرفق ملفاتك بسهولة
              </span>
            </div>

          </div>


          <div class="feature-card">

            <div class="feature-icon">
              🖼️
            </div>

            <div>
              <strong>
                الصور
              </strong>

              <span>
                أرسل الصور داخل المحادثة
              </span>
            </div>

          </div>


          <div class="feature-card">

            <div class="feature-icon">
              ⚡
            </div>

            <div>
              <strong>
                سريع
              </strong>

              <span>
                تجربة بسيطة وسريعة
              </span>
            </div>

          </div>

        </div>

      </section>


      <div
        class="messages"
        id="messages"
      ></div>

    </main>


    <!-- =========================
         COMPOSER
    ========================== -->

    <footer class="composer-area">

      <div
        class="attachments"
        id="attachments"
      ></div>


      <div class="composer">

        <!-- File input -->

        <input
          type="file"
          id="fileInput"
          multiple
          hidden
        >


        <!-- Attach button -->

        <button
          class="tool-button"
          id="attachButton"
          type="button"
          title="إرفاق ملف"
        >
          📎
        </button>


        <!-- Text -->

        <textarea
          id="messageInput"
          rows="1"
          placeholder="اكتب رسالتك أو الصق الكود هنا..."
          spellcheck="false"
        ></textarea>


        <!-- Send -->

        <button
          class="send-button"
          id="sendButton"
          type="button"
          title="إرسال"
        >
          <span>➤</span>
        </button>

      </div>


      <div class="composer-info">

        <span>
          AK Code Protection
        </span>

        <span>
          الملفات حتى 50MB
        </span>

      </div>

    </footer>

  </div>


  <script src="/script.js"></script>

</body>

</html>
